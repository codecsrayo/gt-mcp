[package]
name = "gt-mcp-cli"
version = "0.1.0"
edition = "2021"
description = "Simple CLI to invoke gt-core MCP tools over Streamable HTTP (SSE handshake)"
license = "MIT"

[[bin]]
name = "gtmcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
