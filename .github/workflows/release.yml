name: release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ASSET: gtmcp-x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      # Static musl build: runs on any glibc (incl. older 2.33). No native TLS,
      # so the binary is fully self-contained — no musl-gcc needed.
      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Stage asset
        run: install -m 0755 target/x86_64-unknown-linux-musl/release/gtmcp "$ASSET"

      # Versioned tag push -> attach binary to that release (clobber if re-run).
      - name: Upload to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

      # Every main push -> refresh a rolling 'latest' prerelease so the
      # downloadable binary always matches HEAD of main.
      - name: Refresh rolling latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$ASSET" \
            --prerelease \
            --title "latest (main)" \
            --target "$GITHUB_SHA" \
            --notes "Rolling build from main @ ${GITHUB_SHA::7}. Auto-updated on every push to main."
